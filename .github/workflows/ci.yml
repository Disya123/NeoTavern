# Mandatory test matrix (ТЗ §17): lint, typecheck, unit/integration tests,
# frontend component tests and a production build run on every PR and push.
# Desktop packaging/release lives in desktop-release.yml; E2E below builds the
# app and runs the Playwright suite including the axe accessibility audit.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint / typecheck / unit / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # ТЗ §79 merge-blocking: dependency direction / forbidden-import rules.
      # Runtime Kernel stays host-neutral (no HTTP/UI/platform deps, no
      # is_server/is_android branching); packages never import Rust internals.
      - name: Dependency direction / forbidden imports
        run: node scripts/check-dependency-rules.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright E2E + accessibility (shard ${{ matrix.shard }}/4)
    # Visual baselines are intentionally recorded on Windows; keep the
    # functional/accessibility suite and visual project on the same runner.
    # The suite is sharded across runners (scripts/run-e2e-parallel.mjs):
    # each shard is its own process with its own server, SQLite and ports.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run E2E suite (shard ${{ matrix.shard }}/4)
        run: pnpm build && node scripts/run-e2e-parallel.mjs --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Plugin SDK vNext cross-platform parity (ТЗ §44/§56, Stage J / B18): the
  # IDENTICAL conformance suite, benchmark harness (B01–B31, default gates)
  # and parity recorder run on all three supported OS families. A platform
  # whose report diverges fails the job — same source, same SDK, same error
  # model, same tests.
  plugin-runtime-platforms:
    name: Plugin Runtime conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (dist for runtime/bench/parity)
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test

      - name: Benchmark harness B01–B31 (§47, default gates)
        run: node apps/plugin-runtime/bench/bench-vnext.mjs

      - name: Cross-platform parity report (§44/§46)
        run: node scripts/platform-parity.mjs --out platform-parity-${{ matrix.os }}.json

      - name: Upload parity report
        uses: actions/upload-artifact@v6
        with:
          name: platform-parity-${{ matrix.os }}
          path: platform-parity-${{ matrix.os }}.json
          retention-days: 90

  # Product Wire Contracts (ТЗ §6, Фаза 0): deterministic codegen must leave
  # the tree clean, and the generated Rust boundary DTOs must compile and pass
  # the cross-language corpus. The workspace spans contracts-generated,
  # storage, runtime-kernel (Phase 1+) and the Phase 4 remote-http adapter;
  # all crates are tested together.
  contracts-rust:
    name: Wire contracts codegen + Rust corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (codegen input)
        run: pnpm --filter @neotavern/contracts build

      - name: Contract codegen determinism (must be byte-identical, no writes)
        run: node tools/contract-codegen/codegen.mjs --check

      - name: Contract semantic diff self-test (ТЗ §6.7)
        run: node tools/contract-codegen/diff-test.mjs

      - name: Generated artifacts must be committed (no working-tree diff)
        run: git diff --exit-code -- packages/contracts/generated crates/contracts-generated/src/generated.rs

      - name: Rust boundary corpus + kernel tests
        run: cargo test --manifest-path crates/Cargo.toml

      # ТЗ §79 merge-blocking: Rust fmt/clippy/tests. `contracts-generated` is
      # deliberately excluded from fmt — its generated.rs is emitted
      # byte-identically by codegen.mjs in generator style and its determinism
      # is enforced by the codegen --check step above (hand-editing forbidden,
      # ТЗ §6.1). `cargo fmt --all` would reformat it, so the check lists the
      # hand-written crates explicitly.
      - name: Rust clippy (workspace, all targets, warnings denied)
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Rust formatting (hand-written crates)
        run: cargo fmt --manifest-path crates/Cargo.toml -p runtime-kernel -p neotavern-storage -p remote-http-adapter -p neotavern-mobile-ffi -p neotavern-cli -p built-in-providers -p provider-sdk -p neotavern-envelope -p neotavern-tauri-local --check
