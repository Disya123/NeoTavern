# Mandatory test matrix (ТЗ §17): lint, typecheck, unit/integration tests,
# frontend component tests and a production build run on every PR and push.
# Desktop packaging/release lives in desktop-release.yml; E2E below builds the
# app and runs the Playwright suite including the axe accessibility audit.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint / typecheck / unit / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # ТЗ §79 merge-blocking: dependency direction / forbidden-import rules.
      # Runtime Kernel stays host-neutral (no HTTP/UI/platform deps, no
      # is_server/is_android branching); packages never import Rust internals.
      - name: Dependency direction / forbidden imports
        run: node scripts/check-dependency-rules.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Architecture Convergence (M1, Wave 0) gates:
      # - capability matrix must be committed and up to date (ARC-10);
      # - no NEW /api/v2 / legacyRaw calls in production UI (ARC-02/ARC-03,
      #   ESLint rule `@neotavern/no-legacy-api-surface` + baseline scanner);
      # - docs:check: required docs, relative links, matrix freshness,
      #   exception expiry (ARC-09), misleading offline-Web-Client claims (ARC-12);
      # - docs:sync:check: the Docusaurus mirror of `docs/` must be committed
      #   and byte-identical to a fresh sync (single source tree, ТЗ §19.1).
      # The gates run after Build so the built @neotavern/contracts dist is fresh.
      - name: Capability matrix determinism (ARC-10)
        run: pnpm capability:matrix:check

      - name: Legacy UI surface gate (ARC-02/ARC-03)
        run: pnpm ui:api:check

      - name: Android APK web-assets scanner self-test (ТЗ §18.3)
        run: node scripts/check-android-apk-web-assets.mjs --self-test

      - name: Docs check (links, matrix, exceptions, claims)
        run: pnpm docs:check

      - name: Docs mirror divergence check (single source tree)
        run: pnpm docs:sync:check

      # Acceptance-ledger ordering gate (audit directive): a milestone may
      # only be marked accepted after every earlier milestone is accepted —
      # an accepted M2 with M1 in_progress would claim an impossible stage
      # order (ТЗ 10/10 rev2 §22). Also runs its fixture self-test.
      - name: Acceptance-ledger ordering gate
        run: node scripts/check-milestone-gates.mjs --check && node scripts/check-milestone-gates.mjs --self-test

  e2e:
    name: Playwright E2E + accessibility (shard ${{ matrix.shard }}/4)
    # Visual baselines are intentionally recorded on Windows; keep the
    # functional/accessibility suite and visual project on the same runner.
    # The suite is sharded across runners (scripts/run-e2e-parallel.mjs):
    # each shard is its own process with its own server, SQLite and ports.
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run legacy Fastify E2E suite (shard ${{ matrix.shard }}/4)
        run: pnpm build && node scripts/run-e2e-parallel.mjs --config=playwright.legacy.config.ts --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e-headless:
    name: Playwright Kernel / Web Client → Headless (M7)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Kernel Playwright against neotavern-headless
        run: pnpm test:e2e

  # Plugin SDK vNext cross-platform parity (ТЗ §44/§56, Stage J / B18): the
  # IDENTICAL conformance suite, benchmark harness (B01–B31, default gates)
  # and parity recorder run on all three supported OS families. A platform
  # whose report diverges fails the job — same source, same SDK, same error
  # model, same tests.
  plugin-runtime-platforms:
    name: Plugin Runtime conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (dist for runtime/bench/parity)
        run: pnpm build

      - name: Unit and integration tests
        run: pnpm test

      - name: Benchmark harness B01–B31 (§47, default gates)
        run: node apps/plugin-runtime/bench/bench-vnext.mjs

      - name: Cross-platform parity report (§44/§46)
        run: node scripts/platform-parity.mjs --out platform-parity-${{ matrix.os }}.json

      - name: Upload parity report
        uses: actions/upload-artifact@v6
        with:
          name: platform-parity-${{ matrix.os }}
          path: platform-parity-${{ matrix.os }}.json
          retention-days: 90

  # Product Wire Contracts (ТЗ §6, Фаза 0): deterministic codegen must leave
  # the tree clean, and the generated Rust boundary DTOs must compile and pass
  # the cross-language corpus. The workspace spans contracts-generated,
  # storage, runtime-kernel (Phase 1+) and the Phase 4 remote-http adapter;
  # all crates are tested together.
  contracts-rust:
    name: Wire contracts codegen + Rust corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (codegen input)
        run: pnpm --filter @neotavern/contracts build

      - name: Contract codegen determinism (must be byte-identical, no writes)
        run: node tools/contract-codegen/codegen.mjs --check

      - name: Contract semantic diff self-test (ТЗ §6.7)
        run: node tools/contract-codegen/diff-test.mjs

      - name: Generated artifacts must be committed (no working-tree diff)
        run: git diff --exit-code -- packages/contracts/generated crates/contracts-generated/src/generated.rs

      - name: Rust boundary corpus + kernel tests
        run: cargo test --manifest-path crates/Cargo.toml

      # ТЗ §79 merge-blocking: Rust fmt/clippy/tests. `contracts-generated` is
      # deliberately excluded from fmt — its generated.rs is emitted
      # byte-identically by codegen.mjs in generator style and its determinism
      # is enforced by the codegen --check step above (hand-editing forbidden,
      # ТЗ §6.1). `cargo fmt --all` would reformat it, so the check lists the
      # hand-written crates explicitly.
      - name: Rust clippy (workspace, all targets, warnings denied)
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: M0-D1a presentation paint probe (Vello/wgpu)
        run: cargo test --manifest-path crates/Cargo.toml -p neotavern-presentation-m0 --features gpu && cargo clippy --manifest-path crates/Cargo.toml -p neotavern-presentation-m0 --features gpu --all-targets -- -D warnings

      # Phase 9 remote feature gate (ТЗ §11.2): neotavern-tauri-local's
      # optional `remote` feature wires the desktop Remote Access host
      # service into the shell; the workspace commands above build the crate
      # without it, so compile and lint it with the feature enabled here.
      - name: Phase 9 remote feature gate (tauri-local)
        working-directory: crates
        run: cargo test -p neotavern-tauri-local --features remote && cargo clippy -p neotavern-tauri-local --features remote --all-targets -- -D warnings

      - name: Rust formatting (hand-written crates)
        run: cargo fmt --manifest-path crates/Cargo.toml -p runtime-kernel -p neotavern-storage -p remote-http-adapter -p neotavern-mobile-ffi -p neotavern-cli -p neotavern-headless -p built-in-providers -p provider-sdk -p neotavern-envelope -p neotavern-tauri-local -p neotavern-android-jni -p neotavern-desktop-remote -p neotavern-presentation-m0 --check

  # Android gates — Phase 5: Android Local foundation (JNI bridge, host,
  # mobile transport, CI gates, ТЗ §7.2) + Phase 8: Android background
  # execution (ТЗ §8): the JNI bridge is built for arm64-v8a + x86_64 via
  # cargo-ndk, then the debug APK, JVM unit tests and the Phase 8
  # instrumented-test APK are verified (assembleDebug + testDebugUnitTest +
  # assembleDebugAndroidTest); device-level instrumented tests run nightly
  # (android-device in nightly.yml) across the API 26 + 34 emulator matrix.
  # ТЗ §18.3: assemble is fail-closed without apps/web/dist/index.html.
  android-build:
    name: Android build (JNI + APK + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web client (APK assets, ТЗ §11.4)
        run: pnpm --filter @neotavern/web build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ~/.cargo caches the installed cargo-ndk binary plus the crate registry;
      # the key is pinned to the cargo-ndk version so a toolchain bump re-seeds.
      - name: Cache cargo (cargo-ndk + registry)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: android-actions/setup-android@v3

      - name: Install NDK 27.x
        run: sdkmanager --install "ndk;27.1.12297006"

      # cargo-ndk locates the NDK through ANDROID_NDK_HOME.
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # build-libs.sh is cwd-sensitive and must run from apps/android; it emits
      # apps/android/app/src/main/jniLibs/{arm64-v8a,x86_64}/libneotavern_android_jni.so
      # (build matrix per ТЗ §7.2: Gradle 8.9 / AGP 8.5.2 / Kotlin 1.9.24, JDK 17).
      - name: Build JNI libraries (arm64-v8a, x86_64)
        working-directory: apps/android
        run: bash scripts/build-libs.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # JVM unit tests do not need web assets (merge*Assets is not on that
      # path). assembleDebug is fail-closed without apps/web/dist/index.html.
      # The instrumented-test APK is assembled so WebAssetsPackagedInstrumentedTest,
      # WebViewUserFlowInstrumentedTest and Phase 8 BackgroundExecutionInstrumentedTest
      # COMPILE on every PR; the tests themselves run on the nightly emulator
      # (android-device). assembleRelease is debug-signed so the Packaged gate
      # can unzip a release APK for assets/web/index.html (ТЗ §11.4).
      - name: JVM unit tests
        run: gradle -p apps/android :app:testDebugUnitTest

      - name: Assemble debug + release APKs + instrumented test APK
        run: gradle -p apps/android :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Fail closed if APK lacks assets/web/index.html (ТЗ §18.3)
        run: node scripts/check-android-apk-web-assets.mjs

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: neotavern-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK artifact (Packaged, debug-signed)
        uses: actions/upload-artifact@v6
        with:
          name: neotavern-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # M0-D1a Android compile of the paint probe (Vello/wgpu). Does NOT package
  # the probe .so into the production kernel APK; that stays WebView+JNI.
  android-m0-d1a:
    name: Android M0-D1a paint probe (NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Cache cargo (cargo-ndk + registry)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-ndk-m0-d1a-3.5.4-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/presentation-m0/Cargo.toml') }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - uses: android-actions/setup-android@v3
      - name: Install NDK 27.x
        run: sdkmanager --install "ndk;27.1.12297006"
      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: cargo-ndk compile M0-D1a probe (x86_64 + arm64)
        working-directory: crates
        run: cargo ndk -t x86_64 -t arm64-v8a build --release -p neotavern-presentation-m0 --features gpu,android-jni
