# Nightly matrix (ТЗ §80): the heavyweight cross-checks that are too slow or
# too broad for every PR run on top of the merge-blocking gates in ci.yml.
#
# Covers, with the existing test infrastructure:
#   - full DB support window: open_migrate / fresh_fingerprint / legacy /
#     baseline fixtures (migrations, checksums, fingerprints, rollback)
#   - backup round-trip + restore kill matrix + archive adversarial corpus
#     (storage tests: backup / restore / kill_safety / export / legacy)
#   - single-writer / data-root lease tests (lease.rs), also on Windows NTFS
#   - provider stream interruption + generation fault injection
#     (runtime-kernel tests: generation / providers / backups)
#   - schema-derived contract property/fuzz tests: deterministic boundary
#     fuzz over every generated decoder at a scaled budget — a panic on
#     arbitrary input is a test failure (§6.8/§80)
#   - TS regression baseline (vitest) + docs integrity
#   - Android device gate (Phase 5 + Phase 8, ТЗ §7.2/§8): instrumented
#     tests on API 26 + 34 x86_64 emulators against the JNI bridge
#     (arm64-v8a + x86_64 libs), incl. the background-execution suite
#
# The Rust jobs repeat `cargo test --workspace` and clippy/fmt from ci.yml on
# a schedule so a flake or regression that slipped past PR gates is caught
# within 24h and pinned to a failing nightly report.

name: Nightly

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC every day
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-nightly:
    name: Rust workspace + scaled contract fuzz (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts (codegen input)
        run: pnpm --filter @neotavern/contracts build

      - name: Contract codegen determinism (must be byte-identical)
        run: node tools/contract-codegen/codegen.mjs --check

      - name: Workspace tests (full DB support window + recovery matrix)
        run: cargo test --manifest-path crates/Cargo.toml

      # Scaled deterministic boundary fuzz (§80): 200k iterations across all
      # 45 generated decoders, raw bytes + structurally mutated fixtures.
      # Any panic fails the job.
      - name: Contract boundary fuzz (200k iterations, release)
        run: >-
          cargo test --manifest-path crates/Cargo.toml -p contracts-generated
          --test fuzz_deserialization --release
        env:
          NT_CONTRACT_FUZZ_ITERS: '200000'

      - name: Rust clippy (workspace, all targets, warnings denied)
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      # Phase 9 remote feature gate (ТЗ §11.2): neotavern-tauri-local's
      # optional `remote` feature wires the desktop Remote Access host
      # service into the shell; the workspace commands above build the crate
      # without it, so compile and lint it with the feature enabled here.
      - name: Phase 9 remote feature gate (tauri-local)
        working-directory: crates
        run: cargo test -p neotavern-tauri-local --features remote && cargo clippy -p neotavern-tauri-local --features remote --all-targets -- -D warnings

      - name: Rust formatting (hand-written crates; generated.rs is byte-checked by codegen)
        run: cargo fmt --manifest-path crates/Cargo.toml -p runtime-kernel -p neotavern-storage -p remote-http-adapter -p neotavern-mobile-ffi -p neotavern-cli -p built-in-providers -p provider-sdk -p neotavern-envelope -p neotavern-tauri-local -p neotavern-android-jni -p neotavern-desktop-remote --check

      # §84 performance sampling: Phase 11 backup/restore/export benchmark.
      # The machine-readable report is uploaded as an artifact; threshold
      # comparison against an approved baseline is wired once a baseline
      # fixture is committed (docs/architecture/benchmarks.md).
      - name: Phase 11 benchmark (backup/restore/export throughput)
        run: cargo run --manifest-path crates/Cargo.toml -p neotavern-storage --release --example phase11_bench > crates/storage/bench-report.txt

      - name: Upload benchmark report
        uses: actions/upload-artifact@v6
        with:
          name: nightly-bench-report
          path: crates/storage/bench-report.txt
          retention-days: 90
          if-no-files-found: warn

  rust-windows:
    name: Rust workspace (Windows NTFS filesystem matrix)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Fixtures are committed; no Node toolchain needed for the Rust side.
      # The storage suite exercises the data-root lease, kill-safety, restore
      # activation and backup/export on NTFS (§22/§80 filesystem matrix).
      - name: Workspace tests (Windows)
        run: cargo test --manifest-path crates/Cargo.toml

  ts-nightly:
    name: TS regression baseline + docs (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests (regression baseline)
        run: pnpm test

      # §79 dependency advisory policy for the production graph. Report-only:
      # the audit result is uploaded for triage instead of failing the
      # schedule (findings require a deliberate dependency update, which is
      # out of scope for CI). A triage owner must resolve high findings; the
      # gate becomes fail-closed once the production graph is clean.
      - name: Production dependency advisory scan (report only)
        run: pnpm audit --prod --audit-level high > deps-audit-report.txt || true

      - name: Upload advisory report
        uses: actions/upload-artifact@v6
        with:
          name: nightly-deps-audit
          path: deps-audit-report.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Docs integrity
        run: pnpm docs:check && pnpm docs:build

  # Android device gate (ТЗ §7.2, Phase 5 + Phase 8): JNI libs built for
  # arm64-v8a + x86_64, then instrumented tests run on hardware-accelerated
  # x86_64 emulators across the supported API range (26 = minSdk, 34 =
  # current emulator). Toolchain steps deliberately duplicate ci.yml
  # android-build (no workflow composition).
  android-device:
    name: Android device gate (API ${{ matrix.api-level }} emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache cargo (cargo-ndk + registry)
        uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: cargo-ndk-3.5.4-${{ runner.os }}-${{ hashFiles('crates/Cargo.lock', 'crates/**/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - uses: android-actions/setup-android@v3

      - name: Install NDK 27.x
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Set ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # Same JNI build as ci.yml. build-libs.sh emits arm64-v8a AND x86_64 —
      # the x86_64 .so is what the API 34 x86_64 emulator loads, so it MUST be
      # present here (cargo-ndk invoked with -t x86_64 -t arm64-v8a inside).
      - name: Build JNI libraries (arm64-v8a + x86_64)
        working-directory: apps/android
        run: bash scripts/build-libs.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Required by reactivecircus/android-emulator-runner on Ubuntu runners
      # (hardware acceleration via KVM; documented by the action).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API ${{ matrix.api-level }}, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: gradle -p apps/android :app:connectedDebugAndroidTest
