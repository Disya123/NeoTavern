name: Desktop release gates

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'scripts/*desktop*'
      - 'scripts/package-portable-windows.mjs'
      - 'pnpm-lock.yaml'
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  platform-smoke:
    name: Smoke ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Tauri bundler tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-2.11.4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - name: Build desktop (log to file)
        shell: bash
        timeout-minutes: 25
        env:
          NO_STRIP: '1'
        run: |
          set -o pipefail
          # Watchdog: snapshot bundling state every 30s so a stalled AppImage
          # step leaves a process tree + /tmp footprint in the diag artifact.
          (
            for i in $(seq 1 48); do
              sleep 30
              echo "=== watchdog $(date -u +%H:%M:%S) ===" >> .tmp-watchdog.log
              ps -eo pid,ppid,stat,wchan:24,cmd --forest | grep -iE 'AppRun|linuxdeploy|appimage|squash|strip|patchelf|ldd' | grep -v grep | head -80 >> .tmp-watchdog.log 2>&1
              du -sh /tmp/appimage_extracted_* 2>/dev/null >> .tmp-watchdog.log
            done
          ) &
          WATCHDOG=$!
          # --verbose surfaces linuxdeploy's own stderr, which tauri otherwise swallows.
          # Linux: deb+rpm via tauri (fast, verified), AppImage via the custom
          # pipeline (linuxdeploy deploy-only + pristine sidecar + appimagetool).
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm --dir apps/desktop exec tauri build --bundles deb,rpm --verbose 2>&1 | tee .tmp-desktop-build.log
            node scripts/build-linux-appimage.mjs 2>&1 | tee -a .tmp-desktop-build.log
          else
            pnpm --dir apps/desktop exec tauri build --verbose 2>&1 | tee .tmp-desktop-build.log
          fi
          RC=$?
          kill "$WATCHDOG" 2>/dev/null || true
          exit "$RC"
      - name: Smoke sidecar (log to file)
        shell: bash
        run: |
          set -o pipefail
          pnpm desktop:smoke 2>&1 | tee .tmp-desktop-smoke-run.log
      - name: Smoke native bundle on macOS
        if: runner.os == 'macOS'
        run: pnpm desktop:bundle:smoke
      - name: Smoke native bundle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:bundle:smoke
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
      - name: Upload smoke diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-diag-${{ runner.os }}-${{ runner.arch }}
          path: |
            .tmp-desktop-smoke/
            .tmp-desktop-bundle-smoke/
            .tmp-desktop-build.log
            .tmp-desktop-smoke-run.log
            .tmp-watchdog.log
          if-no-files-found: ignore

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Signed ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      NEOTA_UPDATE_ENDPOINT: ${{ vars.NEOTA_UPDATE_ENDPOINT }}
      NEOTA_UPDATE_PUBLIC_KEY: ${{ vars.NEOTA_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache Tauri bundler tools
        uses: actions/cache@v6
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-2.11.4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --frozen-lockfile
      - name: Require updater release secrets
        shell: bash
        run: |
          test -n "$NEOTA_UPDATE_ENDPOINT"
          test -n "$NEOTA_UPDATE_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Release build (log to file)
        shell: bash
        timeout-minutes: 25
        env:
          NO_STRIP: '1'
        run: |
          set -o pipefail
          # Watchdog: snapshot bundling state every 30s so a stalled AppImage
          # step leaves a process tree + /tmp footprint in the diag artifact.
          (
            for i in $(seq 1 48); do
              sleep 30
              echo "=== watchdog $(date -u +%H:%M:%S) ===" >> .tmp-watchdog.log
              ps -eo pid,ppid,stat,wchan:24,cmd --forest | grep -iE 'AppRun|linuxdeploy|appimage|squash|strip|patchelf|ldd' | grep -v grep | head -80 >> .tmp-watchdog.log 2>&1
              du -sh /tmp/appimage_extracted_* 2>/dev/null >> .tmp-watchdog.log
            done
          ) &
          WATCHDOG=$!
          # Linux: deb+rpm (tauri, with updater config) + AppImage via the custom
          # pipeline (linuxdeploy deploy-only + pristine sidecar + appimagetool);
          # the bundler's single-process deb->rpm->appimage sequence is what
          # hangs on hosted runners. macOS/Windows keep the stock path.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pnpm desktop:prepare 2>&1 | tee .tmp-desktop-build.log
            TAURI_BUNDLES=deb,rpm node scripts/build-desktop-release.mjs 2>&1 | tee -a .tmp-desktop-build.log
            node scripts/build-linux-appimage.mjs 2>&1 | tee -a .tmp-desktop-build.log
            node scripts/smoke-desktop-release.mjs 2>&1 | tee .tmp-desktop-smoke-run.log
          else
            pnpm desktop:release 2>&1 | tee .tmp-desktop-build.log
          fi
          RC=$?
          kill "$WATCHDOG" 2>/dev/null || true
          exit "$RC"
      - name: Smoke sidecar (log to file)
        shell: bash
        run: |
          set -o pipefail
          pnpm desktop:smoke 2>&1 | tee .tmp-desktop-smoke-run.log
      - name: Package and smoke Windows portable build
        if: runner.os == 'Windows'
        run: pnpm desktop:portable:package && pnpm desktop:shell-smoke
      - name: Smoke macOS bundle
        if: runner.os == 'macOS'
        run: pnpm desktop:bundle:smoke
      - name: Smoke Linux bundle
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm desktop:bundle:smoke
      - uses: actions/upload-artifact@v6
        with:
          name: signed-desktop-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
      - name: Upload smoke diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: signed-smoke-diag-${{ runner.os }}-${{ runner.arch }}
          path: |
            .tmp-desktop-smoke/
            .tmp-desktop-bundle-smoke/
            .tmp-desktop-build.log
            .tmp-desktop-smoke-run.log
            .tmp-watchdog.log
          if-no-files-found: ignore

  publish:
    name: Publish release binaries
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !failure()
    needs: [platform-smoke, signed-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: signed-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --draft \
            --title "NeoTavern $GITHUB_REF_NAME" \
            --generate-notes
