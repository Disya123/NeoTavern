<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14161a" />
    <title>NeoTavern</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="connect">
      <h1>NeoTavern</h1>
      <p class="subtitle">Connect to your NeoTavern server</p>
      <form id="connect-form" novalidate>
        <label for="server-url">Server address</label>
        <input
          id="server-url"
          type="text"
          inputmode="url"
          autocomplete="url"
          autocapitalize="off"
          spellcheck="false"
          placeholder="http://192.168.1.5:8000"
          required
        />
        <button type="submit">Connect</button>
        <p id="error" class="error" hidden></p>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
