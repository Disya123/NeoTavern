[package]
name = "neotavern-desktop"
version = "0.1.0"
description = "NeoTavern desktop shell"
authors = ["NeoTavern contributors"]
edition = "2021"
rust-version = "1.84"

[[bin]]
name = "neotavern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
