[package]
name = "neotavern-desktop"
version = "0.1.0"
description = "NeoTavern desktop shell"
authors = ["NeoTavern contributors"]
edition = "2021"
rust-version = "1.84"

[[bin]]
name = "neotavern"
path = "src/main.rs"

[lib]
name = "neotavern_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
url = "2"
# Phase 3 local kernel transport: React → LocalBackend → Tauri IPC → Runtime
# Kernel. The `tauri` feature of the adapter compiles the command surface.
neotavern-tauri-local = { path = "../../../crates/adapters/tauri-local", features = ["tauri"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
