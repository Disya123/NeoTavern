[package]
name = "neotavern-presentation-chat"
version = "0.1.0"
edition = "2021"
description = "Live Product Wire chat workspace for flagged Dioxus Android (not MainActivity)"
license = "AGPL-3.0"
publish = false

[lib]
name = "neotavern_presentation_chat"
crate-type = ["rlib", "cdylib"]

[features]
default = []
android-jni = []
gpu = [
    "dep:wgpu",
    "dep:vello",
    "dep:pollster",
    "dep:raw-window-handle",
    "neotavern-presentation-m0/gpu",
    "neotavern-presentation-m0-d2/gpu",
]

[dependencies]
contracts-generated = { path = "../contracts-generated" }
neotavern-presentation-dioxus-shell = { path = "../presentation-dioxus-shell" }
neotavern-chat-viewport = { path = "../chat-viewport" }
neotavern-neocompositor = { path = "../neocompositor" }
neotavern-presentation-session = { path = "../presentation-session" }
neotavern-presentation-m0 = { path = "../presentation-m0" }
neotavern-presentation-m0-d2 = { path = "../presentation-m0-d2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }
vello = { version = "0.9.0", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "29.0.3", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
    "gles",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
runtime-kernel = { path = "../runtime-kernel" }
tempfile = "3"
