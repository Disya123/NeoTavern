[package]
name = "runtime-kernel"
version = "0.1.0"
edition = "2021"
description = "NeoTavern runtime kernel: operation dispatch over the product wire contract (Phase 1 skeleton, std-only)."
license = "MIT OR Apache-2.0"

[dependencies]
contracts-generated = { path = "../contracts-generated" }
neotavern-storage = { path = "../storage" }
# Phase 7 provider integration: the portable adapter contract plus the
# built-in adapters registered by `providers::ProviderRegistry`.
provider-sdk = { path = "../provider-sdk" }
built-in-providers = { path = "../built-in-providers" }
# Provider-config secrets (ТЗ §9.4, §SEC-01): the kernel holds the SecretStore
# port handle and stores only opaque references in provider_configs.
secret-store = { path = "../secret-store" }
# Production OpenAI-compatible adapter (Этап 2.5): the kernel hydrates
# configured providers into its registry at startup (and on every
# providers.config.set) so a saved config is immediately generatable without
# host-side adapter wiring (M5 slice 48).
provider-openai-compat = { path = "../provider-openai-compat" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same pin as neotavern-storage so both crates share one compiled rusqlite
# (the storage Database hands out its raw `rusqlite::Connection`).
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
uuid = { version = "1", features = ["v7"] }
base64 = "0.22"
# Character-card import: sha256 of the original card bytes (deduplication,
# AGENTS.md §11 — re-importing the same card must not create a duplicate).
sha2 = "0.10"
# Lease expiry timestamps (`now + 30s` formatted RFC 3339, same crate the
# storage layer uses for its wire timestamps).
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
