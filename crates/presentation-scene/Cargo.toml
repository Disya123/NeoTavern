[package]
name = "neotavern-presentation-scene"
version = "0.1.0"
edition = "2021"
description = "ADR-0057 native presentation platform core: retained scene, epoch arena, taffy/Parley/Vello pipeline, editor-core input model"
license = "AGPL-3.0"
publish = false

[lib]
name = "neotavern_presentation_scene"
crate-type = ["rlib"]

[features]
default = []
# Vello/wgpu paint path: encodes FrameSnapshot geometry into a vello::Scene.
# Layout/text/snapshot/hit/editor stay CPU-side and always build.
gpu = ["dep:vello", "dep:peniko"]

[dependencies]
# Mature primitives only (ADR-0057 decision 2): taffy for layout, Parley for
# text shaping/measurement, Vello for paint. No VDOM, no DOM arena, no CSS
# cascade anywhere in this crate.
taffy = { version = "0.12", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "block_layout",
] }
parley = { version = "0.10", default-features = false, features = ["std"] }
# Token resolution and the golden font stack come from the packed React
# design system (platform spec §4: native themes are tokens + data, and the
# tokens are the React goldens until a native theme contract lands).
neotavern-presentation-design-system = { path = "../presentation-design-system" }
serde = { version = "1", features = ["derive"] }
vello = { version = "0.9.0", optional = true, default-features = false, features = [
    "wgpu",
] }
peniko = { version = "0.6", optional = true }

[dev-dependencies]
tempfile = "3"
