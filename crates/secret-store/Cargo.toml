[package]
name = "secret-store"
version = "0.1.0"
edition = "2021"
description = "NeoTavern SecretStore port (ТЗ §SEC-01): explicit backends — portable secrets.enc v2 (Argon2id + AES-256-GCM, ADR-0040), session memory, read-only env, unavailable. Never a plaintext fallback."
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", optional = true }

[features]
default = []
# Machine-bound OS credential vault backend (Windows Credential Manager,
# macOS Keychain, Linux Secret Service). Optional so the crate still builds
# for targets without a desktop vault (Android Keystore is a separate
# adapter). The desktop host enables it; there is never a plaintext fallback.
os-vault = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"
