[package]
name = "neotavern-presentation-m0"
version = "0.1.0"
edition = "2021"
description = "NeoUI v4 M0-D1a/D1b paint-seam / shared-device probe (RFC, non-production)"
license = "AGPL-3.0"
publish = false

[lib]
name = "neotavern_presentation_m0"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Compiles the pinned Vello 0.9 renderer against wgpu 29. DX12 is left off so
# this crate can share the workspace lockfile with Tauri (windows 0.61). The
# Android production backend is Vulkan/GLES, which is what the probe builds.
gpu = ["dep:vello", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
# JNI exports for the debug-only M0D1aActivity. Not linked into production
# libneotavern_android_jni.so.
android-jni = ["gpu"]
# Probe-only RenderDoc in-app capture bound to wgpu-hal's raw VkDevice.
# Does not embed librenderdoc; loads RENDERDOC_GetAPI from the injected layer.
renderdoc-capture = ["gpu", "dep:ash"]

[dependencies]
ash = { version = "0.38", optional = true, default-features = false }
bytemuck = { version = "1.25", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }
vello = { version = "0.9.0", optional = true, default-features = false, features = ["wgpu"] }
wgpu = { version = "29.0.3", optional = true, default-features = false, features = [
    "std",
    "wgsl",
    "vulkan",
    "gles",
    "metal",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[[bin]]
name = "m0-d1a-probe"
path = "src/bin/d1a.rs"
required-features = ["gpu"]

[[bin]]
name = "m0-d1b-probe"
path = "src/bin/d1b.rs"
required-features = ["gpu"]
