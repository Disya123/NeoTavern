[package]
name = "neotavern-headless"
version = "0.1.0"
edition = "2021"
description = "Headless host: composition root that binds remote-http over the shared Runtime Kernel (ТЗ §11.3)."
license = "AGPL-3.0"

[[bin]]
name = "neotavern-headless"
path = "src/main.rs"

[dependencies]
contracts-generated = { path = "../../contracts-generated" }
provider-sdk = { path = "../../provider-sdk" }
remote-http-adapter = { path = "../remote-http" }
runtime-kernel = { path = "../../runtime-kernel" }
secret-store = { path = "../../secret-store" }
neotavern-storage = { path = "../../storage" }

[dev-dependencies]
tempfile = "3"
# The legacy-import fixture builds a real legacy `app.db` (Drizzle-era schema).
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde_json = "1"
contracts-generated = { path = "../../contracts-generated" }
