[package]
name = "neotavern-tauri-local"
version = "0.1.0"
edition = "2021"
description = "Tauri local IPC adapter: React → LocalBackend → Tauri IPC → Runtime Kernel (ТЗ §11.1/§15.1)"
license = "AGPL-3.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true }
contracts-generated = { path = "../../contracts-generated" }
runtime-kernel = { path = "../../runtime-kernel" }
# М5 slice 49: the desktop host wires the kernel's secret seams (ТЗ §SEC-01)
# with a session-only MemorySecretStore + resolver — explicit, no plaintext
# fallback; the OS-vault adapter is a follow-up slice.
secret-store = { path = "../../secret-store" }
provider-sdk = { path = "../../provider-sdk" }
# Shared envelope layer — the Tauri transport answers byte-identical
# response envelopes to the CLI and the remote-http adapter (§6.3).
neotavern-envelope = { path = "../envelope" }
# Phase 9 Remote Access host service (ТЗ §10, §15): wraps the remote-http
# adapter behind a config-persisting service the Desktop shell manages as
# Tauri state. Feature-gated so the workspace test/clippy jobs stay free of
# the Tauri/WRY dependency tree, like `tauri`.
neotavern-desktop-remote = { path = "../desktop-remote", optional = true }

[features]
# The Tauri command surface. Non-default so the workspace test/clippy jobs
# stay free of the Tauri/WRY dependency tree; the Desktop shell enables it
# (`neotavern-tauri-local = { features = ["tauri"] }`).
default = []
tauri = ["dep:tauri"]
# Phase 9 Remote Access (ТЗ §10): the `remote` feature compiles the
# `kernel_remote_*` command surface and the host service state. The desktop
# shell enables both `tauri` and `remote`; the service module itself stays
# Tauri-free (pure serde DTOs) so the workspace can build it standalone.
remote = ["dep:neotavern-desktop-remote"]

[dev-dependencies]
tempfile = "3"
