[package]
name = "neotavern-package-verify"
version = "0.1.0"
edition = "2021"
description = "SEC-05 package trust: ZIP safety + per-file SHA-256 digest + Ed25519 publisher signature verification for plugin/theme packages."
license = "AGPL-3.0"

[dependencies]
sha2 = "0.10"
ring = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
