[package]
name = "neotavern-cli"
version = "0.1.0"
edition = "2021"
description = "CLI transport for the NeoTavern Runtime Kernel (ТЗ §6.3, Phase 4 CLI hooks)"
license = "AGPL-3.0"

[dependencies]
serde_json = "1"
contracts-generated = { path = "../../contracts-generated" }
runtime-kernel = { path = "../../runtime-kernel" }
# The shared envelope layer (decode → protocol check → dispatch → validated
# response envelope) — the CLI and the remote-http adapter must produce
# byte-identical envelopes (§6.3: transports do not define their own DTOs).
neotavern-envelope = { path = "../envelope" }
uuid = { version = "1", features = ["v4"] }
# Offline host-side legacy→kernel migration (ТЗ §10.3): the CLI is the
# maintenance-mode host that runs the staged converter with the kernel
# closed, then opens the kernel on the activated root (data-root switch).
neotavern-storage = { path = "../../storage" }

[dev-dependencies]
tempfile = "3"
# Direct kernel access in tests ONLY, to hold a data-root lease and assert
# DATA_ROOT_IN_USE while the CLI child process runs.
neotavern-storage = { path = "../../storage" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
