[package]
name = "neotavern-presentation-dioxus-shell"
version = "0.1.0"
edition = "2021"
description = "Feature-flagged Dioxus Product Wire shell (not MainActivity)"
license = "AGPL-3.0"
publish = false

[lib]
name = "neotavern_presentation_dioxus_shell"

[dependencies]
contracts-generated = { path = "../contracts-generated" }
neotavern-presentation-design-system = { path = "../presentation-design-system" }
dioxus-core = "=0.8.0-alpha.1"
dioxus-core-macro = "=0.8.0-alpha.1"
dioxus-hooks = "=0.8.0-alpha.1"
dioxus-signals = "=0.8.0-alpha.1"
dioxus_elements = { package = "dioxus-html", version = "=0.8.0-alpha.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
