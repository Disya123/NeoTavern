[package]
name = "neotavern-presentation-m0-d2"
version = "0.1.0"
edition = "2021"
description = "NeoUI v4 M0-D2 Dioxus/Blitz producer-seam probe (RFC, non-production)"
license = "AGPL-3.0"
publish = false

[dependencies]
anyrender = "=0.11.0"
blitz-dom = { version = "=0.3.0-beta.1", default-features = false, features = ["system-fonts", "svg"] }
blitz-paint = { version = "=0.3.0-beta.1", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.1"
dioxus-core = "=0.8.0-alpha.1"
dioxus-core-macro = "=0.8.0-alpha.1"
dioxus-hooks = "=0.8.0-alpha.1"
dioxus_elements = { package = "dioxus-html", version = "=0.8.0-alpha.1", default-features = false }
dioxus-native-dom = { version = "=0.8.0-alpha.1", default-features = false, features = ["system-fonts"] }
neotavern-presentation-design-system = { path = "../presentation-design-system" }
dioxus-signals = "=0.8.0-alpha.1"
kurbo = "0.13.1"
base64 = "0.22"
neotavern-presentation-m0 = { path = "../presentation-m0" }
neotavern-neocompositor = { path = "../neocompositor" }
peniko = "0.6"
vello = { version = "0.9.0", optional = true, default-features = false, features = ["wgpu"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[lib]
name = "neotavern_presentation_m0_d2"
crate-type = ["rlib", "cdylib"]

[features]
default = []
gpu = ["neotavern-presentation-m0/gpu", "dep:vello"]
android-jni = ["gpu"]
renderdoc-capture = ["gpu", "neotavern-presentation-m0/renderdoc-capture"]

[[bin]]
name = "m0-d2-probe"
path = "src/bin/d2.rs"
required-features = ["gpu"]
