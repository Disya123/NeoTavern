[package]
name = "built-in-providers"
version = "0.1.0"
edition = "2021"
description = "Portable built-in provider adapters (fake, recorded) plus the shared conformance suite (ТЗ §55, Фаза 7)"

[dependencies]
provider-sdk = { path = "../provider-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deterministic fake-provider delta hashes (sha256 of `run_key|i`).
sha2 = "0.10"

[dev-dependencies]
# sha2 for the conformance suite's in-test sha256 recompute (byte-identity).
sha2 = "0.10"
tempfile = "3"
