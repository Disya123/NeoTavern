[package]
name = "provider-openai-compat"
version = "0.1.0"
edition = "2021"
description = "Production OpenAI-compatible provider adapter (ТЗ §9.3, Этап 2.5)"

[dependencies]
provider-sdk = { path = "../provider-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tiny_http = "0.12"
