# NeoTavern Rust workspace. The Rust plane is the canonical Kernel, its
# adapters and the provider SDK, plus the experimental NeoCompositor
# (ADR-0059: the product UI is the React contour; the Dioxus/Blitz
# presentation contour was removed at the pivot).
[workspace]
resolver = "2"
members = ["contracts-generated", "runtime-kernel", "storage", "secret-store", "adapters/android-jni", "adapters/remote-http", "adapters/cli", "adapters/desktop-remote", "adapters/headless", "adapters/envelope", "adapters/tauri-local", "adapters/host-tools", "adapters/package-verify", "provider-sdk", "built-in-providers", "plugin-executor", "provider-openai-compat", "adapters/mobile-ffi", "resource-runner", "neocompositor"]

[profile.dev.package."*"]
opt-level = 2
debug = false
