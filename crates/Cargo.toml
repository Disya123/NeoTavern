# NeoTavern Rust workspace (Phase 0/1: wire contracts + runtime kernel).
# The runtime-kernel member is created by the kernel task; it will exist
# before any build runs.
[workspace]
resolver = "2"
members = ["contracts-generated", "runtime-kernel", "storage", "secret-store", "adapters/android-jni", "adapters/remote-http", "adapters/cli", "adapters/desktop-remote", "adapters/headless", "adapters/envelope", "adapters/tauri-local", "adapters/host-tools", "adapters/package-verify", "provider-sdk", "built-in-providers", "provider-openai-compat", "adapters/mobile-ffi", "resource-runner", "neocompositor", "chat-viewport", "presentation-m0", "presentation-m0-d2", "presentation-dioxus-shell", "presentation-chat", "presentation-session", "presentation-perf-probe", "presentation-design-system", "presentation-blueprint", "presentation-kernel-wire"]

# Bounded M0-D2 producer-seam patches. Not a private Blitz/anyrender fork of
# layout or text. See crates/presentation-m0-d2/upstream/.
[patch.crates-io]
anyrender = { path = "vendor/anyrender" }
# Bounded producer-seam patch (see vendor/blitz-dom/NEOTAVERN_PATCH.md):
# tolerate a dead old-parent id in `add_children_to_parent` instead of
# panicking — dioxus-native-dom 0.8.0-alpha.1 ElementId recycling can orphan
# subtree nodes whose `parent` points at an arena-dropped node.
blitz-dom = { path = "vendor/blitz-dom" }
blitz-paint = { path = "vendor/blitz-paint" }
# Diagnostic hook: `set_debug_shader_bounds_checks` for A/B vs upstream `unchecked`.
# Not a WGSL index patch. Default remains upstream unchecked.
vello = { path = "vendor/vello" }

# Interactive hosts (neocompositor-desktop, probes) re-produce the whole
# Dioxus/Blitz document per frame; in an unmodified dev profile that costs
# ~700 ms (dom initial_build ~370 ms + style/layout resolve ~330 ms), which
# turns every resize tick, scroll landing and tap into a slideshow. Dependency
# crates carry almost all of that cost, so they compile optimized even in the
# dev profile; workspace members stay debuggable and fast to rebuild.
[profile.dev.package."*"]
opt-level = 2
debug = false
