# NeoTavern Rust workspace (Phase 0/1: wire contracts + runtime kernel).
# The runtime-kernel member is created by the kernel task; it will exist
# before any build runs.
[workspace]
resolver = "2"
members = ["contracts-generated", "runtime-kernel", "storage", "secret-store", "adapters/android-jni", "adapters/remote-http", "adapters/cli", "adapters/desktop-remote", "adapters/envelope", "adapters/tauri-local", "provider-sdk", "built-in-providers", "provider-openai-compat", "adapters/mobile-ffi"]
